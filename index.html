.pp{--ground:#E8EBEC;--surface:#F8F9F9;--ink:#16232B;--muted:#586A73;--line:#CDD5D8;
--run:#0B7F78;--run-bg:#D5ECE9;--lift:#8A5E00;--lift-bg:#F3E3BC;--rec:#4A5AA0;--rec-bg:#E0E4F5;
--btn:#16232B;--btn-ink:#F8F9F9;--on:#FFFFFF;--bad:#A3392B;--good:#1F7A3E;
--good-bg:#D8EFDF;--bad-bg:#F7DCD7;--made:#2B63C4;--made-bg:#DCE7FA;
--disp:"Avenir Next Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
min-height:100vh;display:flex;flex-direction:column;background:var(--ground);color:var(--ink);
font-family:"Avenir Next","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45}
@media (prefers-color-scheme: dark){.pp{--ground:#0F161A;--surface:#182229;--ink:#E7EEF1;--muted:#95A6AE;--line:#2A3943;
--run:#4CCDC1;--run-bg:#14393A;--lift:#EDB84A;--lift-bg:#3A2F14;--rec:#A5B2EA;--rec-bg:#242B4A;
--btn:#E7EEF1;--btn-ink:#0F161A;--on:#0F161A;--bad:#F08A78;--good:#6FD08C;
--good-bg:#17361F;--bad-bg:#42201B;--made:#8DB6FF;--made-bg:#1C2B4A}}
.pp *{box-sizing:border-box}
.pp button,.pp input,.pp summary{font:inherit}
.pp :focus-visible{outline:3px solid var(--run);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:baseline;padding:calc(14px + env(safe-area-inset-top)) 18px 4px;max-width:520px;width:100%;margin:0 auto}
.brand{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:.01em}
.save{font-size:12px;color:var(--muted)}
.syncbtn{background:none;border:0;padding:6px 0 6px 10px;cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.syncbtn.ok{color:var(--good);text-decoration:none;font-weight:600}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.35;margin-top:6px;resize:vertical}
.filein{display:block;width:100%;margin:6px 0;font-size:14px}
.errtxt{color:var(--bad)}
.linkbtn.left{margin:0;padding:6px 2px;text-align:left;display:inline-block}
.main{flex:1;width:100%;max-width:520px;margin:0 auto;padding:4px 14px 28px}
.disp{font-family:var(--disp);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.005em}
.muted{color:var(--muted)}.small{font-size:14px}.block{display:block}.grow{flex:1}
.tight{margin:8px 0 0}.nomargin{margin:0}.pt{padding-top:10px;margin:6px 0}
.spacer{height:12px}
.title{font-size:32px;line-height:1.1;margin:6px 0 4px}
.h3{font-size:17px;font-weight:700;margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.hero{border-radius:20px;padding:18px 18px 16px}
.stripe{border-left:7px solid var(--c)}
.t-run{--c:var(--run);--cbg:var(--run-bg)}.t-lift{--c:var(--lift);--cbg:var(--lift-bg)}.t-rec{--c:var(--rec);--cbg:var(--rec-bg)}
.chiprow{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.chip{display:inline-block;padding:2px 11px;border-radius:999px;font-size:13px;font-weight:700;background:var(--cbg);color:var(--c)}
.hero .chip{background:var(--cbg);color:var(--c)}
.weekline{margin:10px 0 0}
.datebar{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.datetxt{text-align:center}
.bigdate{font-size:30px;line-height:1.1}
.iconbtn{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.linkbtn{display:block;margin:0 auto 6px;background:none;border:0;color:var(--run);font-weight:650;cursor:pointer;padding:8px;text-decoration:underline}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 18px;font-weight:650;background:var(--btn);color:var(--btn-ink);cursor:pointer;min-height:48px}
.btn.block{display:block;width:100%;margin:12px 0}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{min-height:40px;padding:7px 14px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.notice{background:var(--lift-bg);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.notice.err{background:transparent;border:1.5px solid var(--bad);color:var(--bad)}
.rowbetween{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.inline{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:block;margin:0 0 12px}
.flabel{display:block;font-size:14px;font-weight:650;margin-bottom:5px}
.flabel.gap{margin-top:8px}
.fhint{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.inwrap{position:relative}
.inp{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--ground);color:var(--ink)}
.inwrap .inp{padding-right:38px}
.suffix{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none}
.inp.num{text-align:center;font-family:var(--disp);font-weight:700;font-size:19px;padding:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;min-height:44px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;padding:6px 10px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink);font-weight:700}
.seg.five button{min-width:0}
.feel{margin:14px 0 6px}
.feel .inp{margin-top:8px}
.exercise{--c:var(--lift)}
.exercise .target{font-size:26px;line-height:1.1;color:var(--c)}
.setrow{display:grid;grid-template-columns:46px 1fr 16px 1fr;gap:8px;align-items:center;margin:8px 0}
.times{text-align:center;color:var(--muted)}
.setchk{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--muted);font-weight:700;display:grid;place-items:center;cursor:pointer;padding:0}
.setchk.on{background:var(--c);border-color:var(--c);color:var(--on)}
.setchk.small{width:26px;height:26px;flex:none}
.progressline{display:flex;align-items:center;gap:12px;margin:8px 2px}
.progressbar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progressbar>div{height:100%;background:var(--c, var(--run));border-radius:99px}
.hero.t-lift ~ .progressline{--c:var(--lift)}
.rec-card{--c:var(--rec)}
.donebox{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.donetxt{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--good)}
.steps{margin:0;padding-left:0;list-style:none}
.steps li{padding:10px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.stepl{font-weight:650}
.paceout{margin:4px 0 0;font-size:17px}.paceout .disp{font-size:26px}
.checkrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px;color:var(--ink);cursor:pointer;min-height:52px}
.checkrow:last-of-type{border-bottom:0}
.checkrow.on .stepl{text-decoration:line-through;color:var(--muted)}
.checkrow .setchk{--c:var(--rec)}
.checkrow.on .setchk{background:var(--rec);border-color:var(--rec);color:var(--on)}
.summary{display:flex;flex-wrap:wrap;gap:6px 0}
.stat{flex:1;display:flex;flex-direction:column;align-items:flex-start;padding-right:8px}
.stat .big{font-size:34px;line-height:1}
.phaseline{width:100%;margin-top:8px}
.list{padding:4px 12px}
.dayrow{display:grid;grid-template-columns:54px 1fr 30px;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 2px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);cursor:pointer;min-height:64px}
.dayrow:last-child{border-bottom:0}
.dayname{display:flex;flex-direction:column;line-height:1.15}
.dayname .disp{font-size:20px}
.daymain{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.daydesc{font-size:15px}
.dayrow.istoday .dayname .disp{color:var(--run)}
.status{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;border:2px solid transparent}
.status.done{background:var(--good);color:var(--on)}
.status.partial{border-color:var(--lift);color:var(--lift)}
.status.madeup{background:var(--made);color:var(--on)}
.status.skipped{border-color:var(--bad);color:var(--bad)}
.how summary{cursor:pointer;font-weight:700}
.how p{margin:10px 0 0}
.lanebox{margin:14px 0 20px}
.lanehead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.lanetitle{font-weight:700}.lanenote{font-size:14px;color:var(--muted)}
.lane{position:relative;height:30px;border-radius:15px;background:var(--ground);border:1.5px solid var(--line);overflow:visible}
.lane::before{content:"";position:absolute;left:14px;right:14px;top:50%;height:2px;margin-top:-1px;background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 20px)}
.lanefill{position:absolute;left:0;top:0;bottom:0;border-radius:15px;background:var(--cbg,var(--run-bg));border-right:0}
.lanemark{position:absolute;top:1px;width:24px;height:24px;border-radius:50%;background:var(--c,var(--run));border:3px solid var(--surface)}
.laneflag{position:absolute;right:8px;top:6px;width:10px;height:16px;background:repeating-conic-gradient(var(--ink) 0 25%,transparent 0 50%) 0 0/8px 8px;border-radius:2px}
.lanelabels{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin-top:4px}
.lanenow{font-size:22px;color:var(--ink)}
.plain{margin:0 0 12px;padding-left:18px}.plain li{margin:6px 0}
.danger{border-color:var(--bad)}
.tabwrap{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);max-width:520px;margin:0 auto}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 10px;background:none;border:0;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;min-height:56px}
.tabs button.on{color:var(--run);box-shadow:inset 0 3px 0 var(--run)}

.top.wide,.main.wide{max-width:1040px}
.btncol{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.chipwrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.gapt{margin-top:12px}
.scrim{position:fixed;inset:0;background:rgba(10,16,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px 30px}
.optrow{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:1px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;color:var(--ink);cursor:pointer;min-height:48px}
.optrow.custom{flex-direction:row;justify-content:space-between;align-items:center;gap:10px;color:var(--run);font-weight:650}
.grouptitle{font-size:14px;font-weight:700;color:var(--muted);margin:16px 0 2px}
.sheetfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12.5px;font-weight:700;border:1.5px solid currentColor;white-space:nowrap}
.pill.done{color:var(--good);background:var(--good-bg)}
.pill.madeup{color:var(--made);background:var(--made-bg)}
.pill.partial{color:var(--lift);background:var(--lift-bg)}
.pill.skipped{color:var(--bad);background:var(--bad-bg)}
.pill.upcoming{color:var(--muted);background:transparent}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.filters{margin-bottom:4px}.filters .inp{flex:1}
.stat .big.good{color:var(--good)}.stat .big.made{color:var(--made)}.stat .big.warn{color:var(--lift)}.stat .big.bad{color:var(--bad)}
.hweek{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:4px;align-items:center;margin:5px 0}
.hday{text-align:center}
.hweek>.small{font-size:12px;line-height:1.1}
.hcell{height:46px;width:100%;border-radius:9px;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:17px;line-height:1;background:transparent;color:var(--muted);cursor:pointer;padding:0}
.hcell small{font-size:10px;font-weight:700;margin-top:2px;opacity:.85}
.hcell .sym{min-height:17px}
.hcell.empty{border:0;cursor:default}
.hcell.done{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.hcell.madeup{background:var(--made-bg);border-color:var(--made);color:var(--made)}
.hcell.partial{background:var(--lift-bg);border-color:var(--lift);color:var(--lift)}
.hcell.skipped{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.hcell.today{outline:2px solid var(--ink);outline-offset:1px}
.hcell.dim{opacity:.22}
.logrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
.logrow:last-child{border-bottom:0}
.logmain{display:flex;flex-direction:column;gap:3px}
.logtop{display:flex;align-items:center;gap:10px}
.logdate{font-size:19px}
.exhead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;color:var(--ink);cursor:pointer;padding:0;min-height:48px}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:150px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dot.done{background:var(--good);border-color:var(--good)}
.dot.madeup{background:var(--made);border-color:var(--made)}
.dot.partial{background:var(--lift);border-color:var(--lift)}
.dot.skipped{background:var(--bad);border-color:var(--bad)}
.exdetail{margin-top:8px;border-top:1px solid var(--line)}
.histwrap,.exgrid,.cols{display:block}
@media (min-width:880px){
  .histwrap{display:grid;grid-template-columns:minmax(400px,1fr) 1fr;gap:0 18px;align-items:start}
  .exgrid,.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;align-items:start}
  .hcell{height:56px}
}

.tabs button{padding-left:0;padding-right:0;font-size:11px}
.tabicon{position:relative;display:inline-flex}
.badge{position:absolute;top:-6px;right:-12px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:var(--on);font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.sect{margin:18px 0 0}
.timerbar{position:sticky;top:0;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:8px 0}
.timeridle{display:flex;align-items:center;justify-content:space-between;gap:10px}
.timerlabel{font-weight:700}
.timerpresets{display:flex;gap:8px}
.timerbtn{min-width:64px;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-family:var(--disp);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;cursor:pointer}
.timerrun{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.timertime{font-size:40px;line-height:1;min-width:92px}
.timermid{display:flex;flex-direction:column;gap:5px;min-width:0}
.timertrack{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.timertrack>div{height:100%;background:var(--run);border-radius:99px;transition:width .25s linear}
.timerctl{display:flex;gap:6px}
.timerbar.done{border-color:var(--good);background:var(--good-bg)}
.timerbar.done .timertime{color:var(--good)}
.timerbar.pause .timertime{color:var(--muted)}
.exercise.st-done{border-left:6px solid var(--good)}
.exercise.st-madeup{border-left:6px solid var(--made)}
.exercise.st-partial{border-left:6px solid var(--lift)}
.exercise.st-skipped{border-left:6px solid var(--bad)}
.exercise .pill{margin-top:6px}
.reprow{grid-template-columns:46px 1fr 84px}
.repdiff{font-size:13px;font-weight:600;text-align:right;color:var(--muted)}
.repdiff.ok{color:var(--good)}.repdiff.slow{color:var(--lift)}
.adjnote{color:var(--run)}
.notice.milestone{background:var(--good-bg);border-color:var(--good)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.slotbox{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.slothead{font-weight:700;margin-bottom:8px}
.lifted{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px;background:var(--ground)}
.mkday{margin-top:6px}.mkdate{font-size:15px;color:var(--ink);margin-top:18px}
.mkitem{margin:8px 0}
.mkhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 2px -4px}
@media (prefers-reduced-motion: no-preference){.progressbar>div{transition:width .25s ease}}
