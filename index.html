.pp{--ground:#E8EBEC;--surface:#F8F9F9;--ink:#16232B;--muted:#586A73;--line:#CDD5D8;
--run:#0B7F78;--run-bg:#D5ECE9;--lift:#B8492A;--lift-bg:#FAE3DA;--warn:#8A5E00;--warn-bg:#F3E3BC;--rec:#4A5AA0;--rec-bg:#E0E4F5;
--btn:#16232B;--btn-ink:#F8F9F9;--on:#FFFFFF;--bad:#A3392B;--good:#1F7A3E;
--good-bg:#D8EFDF;--bad-bg:#F7DCD7;--made:#2B63C4;--made-bg:#DCE7FA;
--disp:"Avenir Next Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
min-height:100vh;display:flex;flex-direction:column;background:var(--ground);color:var(--ink);
font-family:"Avenir Next","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45}
@media (prefers-color-scheme: dark){.pp{--ground:#0F161A;--surface:#182229;--ink:#E7EEF1;--muted:#95A6AE;--line:#2A3943;
--run:#4CCDC1;--run-bg:#14393A;--lift:#F0997B;--lift-bg:#3B2219;--warn:#EDB84A;--warn-bg:#3A2F14;--rec:#A5B2EA;--rec-bg:#242B4A;
--btn:#E7EEF1;--btn-ink:#0F161A;--on:#0F161A;--bad:#F08A78;--good:#6FD08C;
--good-bg:#17361F;--bad-bg:#42201B;--made:#8DB6FF;--made-bg:#1C2B4A}}
.pp *{box-sizing:border-box}
.pp button,.pp input,.pp summary{font:inherit}
.pp :focus-visible{outline:3px solid var(--run);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(14px + env(safe-area-inset-top)) 18px 4px;max-width:520px;width:100%;margin:0 auto}
.brand{font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:.01em;display:flex;align-items:center;gap:9px}
.brand .appmark{border-radius:9px}
.save{font-size:12px;color:var(--muted)}
.hdrright{display:flex;align-items:center;gap:4px;min-width:0}
.brand span{white-space:nowrap}
.hdrright .save{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gearbtn{background:none;border:0;color:var(--muted);width:40px;height:44px;display:grid;place-items:center;cursor:pointer;border-radius:50%}
.syncbtn{background:none;border:0;padding:6px 0 6px 6px;cursor:pointer;font-size:12px;text-decoration:underline;text-underline-offset:3px}
.syncbtn.ok{color:var(--good);text-decoration:none;font-weight:600}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.35;margin-top:6px;resize:vertical}
.filein{display:block;width:100%;margin:6px 0;font-size:14px}
.errtxt{color:var(--bad)}
.linkbtn.left{margin:0;padding:6px 2px;text-align:left;display:inline-block}
.main{flex:1;width:100%;max-width:520px;margin:0 auto;padding:4px 14px 28px}
.disp{font-family:var(--disp);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.005em}
.muted{color:var(--muted)}.small{font-size:14px}.block{display:block}.grow{flex:1}
.tight{margin:8px 0 0}.nomargin{margin:0}.pt{padding-top:10px;margin:6px 0}
.spacer{height:12px}
.title{font-size:32px;line-height:1.1;margin:6px 0 4px}
.h3{font-size:17px;font-weight:700;margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.hero{border-radius:20px;padding:18px 18px 16px}
.stripe{border-left:7px solid var(--c)}
.hero.stripe{border:2px solid var(--c);border-left-width:7px;background:var(--surface);background:color-mix(in srgb,var(--cbg) 60%,var(--surface))}
.exercise{background:var(--surface);background:color-mix(in srgb,var(--lift-bg) 30%,var(--surface))}
.summary{gap:8px}
.summary .stat{border-radius:12px;padding:10px;background:var(--ground)}
.summary .stat:has(.big.good){background:var(--good-bg)}.summary .stat:has(.big.made){background:var(--made-bg)}.summary .stat:has(.big.warn){background:var(--warn-bg)}.summary .stat:has(.big.bad){background:var(--bad-bg)}
.swface.work .swbig{color:var(--lift)}
.stattiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stile{background:var(--cbg);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.stile .disp{font-size:26px;line-height:1.05;color:var(--c)}
.stile .stlab{font-size:12px;font-weight:700;color:var(--c)}
.goalhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.goalhead .h3{margin:0}
.goalbtns{display:flex;gap:6px}
.goalrow{margin:0;padding:10px 0;border-top:1px solid var(--line)}
.goalline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.goalline .lanetitle{font-weight:700;font-size:15px;min-width:0}
.goalnow{font-size:14px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.goalrow.reached .goalnow{color:var(--good);font-weight:700}
.goalbar{height:7px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.goalbar>div{height:100%;border-radius:4px;background:var(--c)}
.goalsub{font-size:13px;color:var(--muted);margin-top:4px}
.goalfoot{border-top:1px solid var(--line);padding-top:6px}
.notice.reconnect{background:var(--run-bg)}
.goalrm{min-height:36px;padding:0 12px;border-radius:10px;border:1.5px solid var(--bad);background:transparent;color:var(--bad);font-weight:700;cursor:pointer}
.mschips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 12px}
.mschip{font-size:13px;padding:5px 10px;border-radius:10px;background:var(--good-bg);color:var(--good);font-weight:700}
.t-run{--c:var(--run);--cbg:var(--run-bg)}.t-lift{--c:var(--lift);--cbg:var(--lift-bg)}.t-rec{--c:var(--rec);--cbg:var(--rec-bg)}
.chiprow{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.chip{display:inline-block;padding:2px 11px;border-radius:999px;font-size:13px;font-weight:700;background:var(--cbg);color:var(--c)}
.hero .chip{background:var(--cbg);color:var(--c)}
.weekline{margin:10px 0 0}
.datebar{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.datetxt{text-align:center}
.bigdate{font-size:30px;line-height:1.1}
.iconbtn{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.linkbtn{display:block;margin:0 auto 6px;background:none;border:0;color:var(--run);font-weight:650;cursor:pointer;padding:8px;text-decoration:underline}
.linkbtn.inline{display:inline;margin:0;padding:0 4px}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 18px;font-weight:650;background:var(--btn);color:var(--btn-ink);cursor:pointer;min-height:48px}
.btn.block{display:block;width:100%;margin:12px 0}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{min-height:40px;padding:7px 14px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.notice{background:var(--warn-bg);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.notice.err{background:transparent;border:1.5px solid var(--bad);color:var(--bad)}
.rowbetween{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.inline{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:block;margin:0 0 12px}
.flabel{display:block;font-size:14px;font-weight:650;margin-bottom:5px}

.weekrow:last-child{border-bottom:0}
.weekday{font-size:20px}
.weekmain{display:flex;flex-direction:column;gap:3px;min-width:0}
.weeksel{min-height:42px}
.srcrow{padding:10px 0;border-top:1px solid var(--line)}
.suggcard .target{color:var(--lift)}
.tickrow{display:flex;align-items:center;gap:10px;margin:8px 0 12px;font-size:15px}
.tickrow input{width:22px;height:22px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.slotbox{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.slothead{font-weight:700;margin-bottom:8px}
.lifted{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px;background:var(--ground)}
.mkday{margin-top:6px}.mkdate{font-size:15px;color:var(--ink);margin-top:18px}
.mkitem{margin:8px 0}
.mkhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 2px -4px}
@media (prefers-reduced-motion: no-preference){.progressbar>div{transition:width .25s ease}}
